al binary shift</b>?", "options": ["The process of reducing the size of a file to save storage space and reduce transmission time", "A group of 4 bits", "Moving binary values in a register to the left or right; left shift multiplies by 2, right shift divides by 2", "A lossless compression algorithm for images that groups repeating pixels and stores the colour and count"], "correct": 2, "explanation": "Moving binary values in a register to the left or right; left shift multiplies by 2, right shift divides by 2"}, {"id": "term_12", "type": "mcq", "question": "What is the definition of <b>Two&#x27;s complement</b>?", "options": ["Data that provides information about other data, such as the dimensions and resolution of an image", "A method of representing negative numbers in binary by inverting all bits and adding 1", "A tiny dot that makes up a digital image; the smallest element of a display screen", "A compression method that permanently removes unnecessary data from the file; reduces quality"], "correct": 1, "explanation": "A method of representing negative numbers in binary by inverting all bits and adding 1"}, {"id": "term_13", "type": "mcq", "question": "What is the definition of <b>Character set</b>?", "options": ["The number of sound samples taken per second, measured in hertz (Hz); a common rate is 44.1 kHz", "A defined list of characters recognised by a computer, where each character is assigned a unique binary code", "Discrete data that has only two values: 1 and 0; also called binary data", "A lossy compression technique for sound that removes sounds the human ear cannot perceive; used in MP3"], "correct": 1, "explanation": "A defined list of characters recognised by a computer, where each character is assigned a unique binary code"}, {"id": "term_14", "type": "mcq", "question": "What is the definition of <b>ASCII</b>?", "options": ["The smallest unit of data; a single binary digit (0 or 1)", "American Standard Code for Information Interchange; an 8-bit character set representing up to 256 characters", "A method of representing negative numbers in binary by inverting all bits and adding 1", "A 16-bit character set capable of representing approximately 65,000 characters from many languages and symbols"], "correct": 1, "explanation": "American Standard Code for Information Interchange; an 8-bit character set representing up to 256 characters"}, {"id": "term_15", "type": "mcq", "question": "What is the definition of <b>Unicode</b>?", "options": ["A base-10 number system using the digits 0 to 9; the number system used in everyday life", "A compression method that permanently removes unnecessary data from the file; reduces quality", "A lossless compression algorithm for images that groups repeating pixels and stores the colour and count", "A 16-bit character set capable of representing approximately 65,000 characters from many languages and symbols"], "correct": 3, "explanation": "A 16-bit character set capable of representing approximately 65,000 characters from many languages and symbols"}, {"id": "term_16", "type": "mcq", "question": "What is the definition of <b>Pixel</b>?", "options": ["A tiny electronic component in a computer that processes digital data", "A tiny dot that makes up a digital image; the smallest element of a display screen", "A small, fast storage location inside the CPU where binary data is stored and processed", "A base-16 number system using the symbols 0\u20139 and A\u2013F"], "correct": 1, "explanation": "A tiny dot that makes up a digital image; the smallest element of a display screen"}, {"id": "term_17", "type": "mcq", "question": "What is the definition of <b>Resolution</b>?", "options": ["A 16-bit character set capable of representing approximately 65,000 characters from many languages and symbols", "The process of recording sound at set time intervals to convert it into digital data", "A tiny electronic component in a computer that processes digital data", "The number of pixels wide and pixels high that make up an image; higher resolution means more detail"], "correct": 3, "explanation": "The number of pixels wide and pixels high that make up an image; higher resolution means more detail"}, {"id": "term_18", "type": "mcq", "question": "What is the definition of <b>Colour depth</b>?", "options": ["The number of bits used to represent the colour of each pixel; higher colour depth means more colours", "A base-16 number system using the symbols 0\u20139 and A\u2013F", "The process of reducing the size of a file to save storage space and reduce transmission time", "A compression method that permanently removes unnecessary data from the file; reduces quality"], "correct": 0, "explanation": "The number of bits used to represent the colour of each pixel; higher colour depth means more colours"}, {"id": "term_19", "type": "mcq", "question": "What is the definition of <b>Metadata</b>?", "options": ["Data that provides information about other data, such as the dimensions and resolution of an image", "The process of reducing the size of a file to save storage space and reduce transmission time", "The smallest unit of data; a single binary digit (0 or 1)", "A method of representing negative numbers in binary by inverting all bits and adding 1"], "correct": 0, "explanation": "Data that provides information about other data, such as the dimensions and resolution of an image"}, {"id": "term_20", "type": "mcq", "question": "What is the definition of <b>RGB</b>?", "options": ["A lossless compression algorithm for images that groups repeating pixels and stores the colour and count", "Red Green Blue colour system used by computer screens to create colours by mixing different amounts of red, green, and blue", "Discrete data that has only two values: 1 and 0; also called binary data", "A small, fast storage location inside the CPU where binary data is stored and processed"], "correct": 1, "explanation": "Red Green Blue colour system used by computer screens to create colours by mixing different amounts of red, green, and blue"}, {"id": "term_21", "type": "mcq", "question": "What is the definition of <b>Sound sampling</b>?", "options": ["The process of recording sound at set time intervals to convert it into digital data", "The number of bits used to represent the colour of each pixel; higher colour depth means more colours", "Moving binary values in a register to the left or right; left shift multiplies by 2, right shift divides by 2", "The number of pixels wide and pixels high that make up an image; higher resolution means more detail"], "correct": 0, "explanation": "The process of recording sound at set time intervals to convert it into digital data"}, {"id": "term_22", "type": "mcq", "question": "What is the definition of <b>Sample rate</b>?", "options": ["The smallest unit of data; a single binary digit (0 or 1)", "The number of pixels wide and pixels high that make up an image; higher resolution means more detail", "The number of sound samples taken per second, measured in hertz (Hz); a common rate is 44.1 kHz", "American Standard Code for Information Interchange; an 8-bit character set representing up to 256 characters"], "correct": 2, "explanation": "The number of sound samples taken per second, measured in hertz (Hz); a common rate is 44.1 kHz"}, {"id": "term_23", "type": "mcq", "question": "What is the definition of <b>Sample resolution</b>?", "options": ["The number of bits used to represent each sound sample; higher resolution means more accurate recording", "A base-10 number system using the digits 0 to 9; the number system used in everyday life", "A group of 8 bits", "An error that occurs when the result of a calculation is too large to be stored in the available number of bits"], "correct": 0, "explanation": "The number of bits used to represent each sound sample; higher resolution means more accurate recording"}, {"id": "term_24", "type": "mcq", "question": "What is the definition of <b>Compression</b>?", "options": ["A base-16 number system using the symbols 0\u20139 and A\u2013F", "The process of reducing the size of a file to save storage space and reduce transmission time", "A method of representing negative numbers in binary by inverting all bits and adding 1", "The number of sound samples taken per second, measured in hertz (Hz); a common rate is 44.1 kHz"], "correct": 1, "explanation": "The process of reducing the size of a file to save storage space and reduce transmission time"}, {"id": "term_25", "type": "mcq", "question": "What is the definition of <b>Lossy compression</b>?", "options": ["Red Green Blue colour system used by computer screens to create colours by mixing different amounts of red, green, and blue", "The number of bits used to represent the colour of each pixel; higher colour depth means more colours", "A compression method that permanently removes unnecessary data from the file; reduces quality", "A group of 4 bits"], "correct": 2, "explanation": "A compression method that permanently removes unnecessary data from the file; reduces quality"}, {"id": "term_26", "type": "mcq", "question": "What is the definition of <b>Lossless compression</b>?", "options": ["A continuous stream of data, such as what we see, hear, feel, and smell", "A lossless compression algorithm for images that groups repeating pixels and stores the colour and count", "A base-10 number system using the digits 0 to 9; the number system used in everyday life", "A compression method that reduces file size without permanently removing any data; the original can be perfectly recreated"], "correct": 3, "explanation": "A compression method that reduces file size without permanently removing any data; the original can be perfectly recreated"}, {"id": "term_27", "type": "mcq", "question": "What is the definition of <b>Perceptual music shaping</b>?", "options": ["A group of 4 bits", "A lossy compression technique for sound that removes sounds the human ear cannot perceive; used in MP3", "The number of pixels wide and pixels high that make up an image; higher resolution means more detail", "A compression method that permanently removes unnecessary data from the file; reduces quality"], "correct": 1, "explanation": "A lossy compression technique for sound that removes sounds the human ear cannot perceive; used in MP3"}, {"id": "term_28", "type": "mcq", "question": "What is the definition of <b>Run length encoding (RLE)</b>?", "options": ["American Standard Code for Information Interchange; an 8-bit character set representing up to 256 characters", "A lossless compression algorithm for images that groups repeating pixels and stores the colour and count", "The number of bits used to represent each sound sample; higher resolution means more accurate recording", "A small, fast storage location inside the CPU where binary data is stored and processed"], "correct": 1, "explanation": "A lossless compression algorithm for images that groups repeating pixels and stores the colour and count"}], "freeform": [{"id": "qa_0", "type": "freeform", "question": "Can you think of three examples of analogue data?", "answer": "Examples include: (1) the sound of someone speaking, (2) the colours and shapes you see when looking at a landscape, (3) the temperature you feel on your skin. Any continuous stream of sensory information is analogue data.", "marks": null}, {"id": "qa_1", "type": "freeform", "question": "Why is analogue data described as continuous data?", "answer": "Analogue data is continuous because it flows as a constant, unbroken stream of values. It does not have distinct, separate steps \u2014 it varies smoothly over time. For example, a sound wave changes continuously in amplitude.", "marks": null}, {"id": "qa_2", "type": "freeform", "question": "What is the largest denary number that can be created with a 4-bit binary number?", "answer": "1111 in binary = 8 + 4 + 2 + 1 = 15. The largest denary number is 15.", "marks": null}, {"id": "qa_3", "type": "freeform", "questi let allQ = [];
let idx = 0;
let score = 0;
let answered = 0;

function init() {
  allQ = [...(DATA.mcq||[]), ...(DATA.truefalse||[]), ...(DATA.freeform||[])];
  if (!allQ.length) { document.getElementById('scoreDisplay').textContent = 'No questions available.'; return; }
  idx = 0; score = 0; answered = 0;
  renderAll();
  showQuestion(0);
}

function renderAll() {
  const c = document.getElementById('questionsContainer');
  c.innerHTML = '';
  allQ.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q_' + i;

    let typeLabel = q.type === 'mcq' ? 'Multiple Choice' : q.type === 'truefalse' ? 'True / False' : 'Written Answer';
    let inner = `<div class="q-number">Question ${i+1} of ${allQ.length}</div>`;
    inner += `<span class="q-type">${typeLabel}</span>`;

    if (q.type === 'mcq') {
      inner += `<div class="q-text">${q.question}</div>`;
      q.options.forEach((o, oi) => {
        inner += `<button class="option" data-qi="${i}" data-oi="${oi}" onclick="answerMCQ(${i},${oi})">${o}</button>`;
      });
      inner += `<div class="explanation" id="expl_${i}">${q.explanation||''}</div>`;
    } else if (q.type === 'truefalse') {
      inner += `<div class="q-text">${q.statement}</div>`;
      inner += `<div class="tf-btns"><button data-qi="${i}" data-val="true" onclick="answerTF(${i},true)">True</button>`;
      inner += `<button data-qi="${i}" data-val="false" onclick="answerTF(${i},false)">False</button></div>`;
      inner += `<div class="explanation" id="expl_${i}">Correct statement: ${q.explanation||''}</div>`;
    } else {
      inner += `<div class="q-text">${q.question}</div>`;
      inner += `<textarea class="freeform-area" id="ans_${i}" placeholder="Type your answer..."></textarea>`;
      inner += `<div class="explanation" id="expl_${i}"><b>Model answer:</b> ${q.answer||''}</div>`;
    }

    inner += `<div class="nav-btns">`;
    if (q.type === 'freeform') inner += `<button class="btn-reveal" onclick="revealFreeform(${i})">Show Answer</button>`;
    else inner += `<span></span>`;
    inner += `<button class="btn-next" id="next_${i}" onclick="nextQ()">${i===allQ.length-1?'Finish':'Next →'}</button>`;
    inner += `</div>`;

    card.innerHTML = inner;
    c.appendChild(card);
  });
}

function showQuestion(n) {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('q_' + n);
  if (card) card.classList.add('active');
  document.getElementById('progressFill').style.width = ((n+1)/allQ.length*100) + '%';
  document.getElementById('scoreDisplay').textContent = `Question ${n+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function answerMCQ(qi, oi) {
  const q = allQ[qi];
  const btns = document.querySelectorAll(`button[data-qi="${qi}"]`);
  btns.forEach(b => { b.disabled = true; b.classList.remove('selected'); });
  btns[oi].classList.add('selected');
  if (oi === q.correct) { btns[oi].classList.add('correct'); score++; }
  else { btns[oi].classList.add('wrong'); btns[q.correct].classList.add('correct'); }
  answered++;
  document.getElementById('expl_' + qi).classList.add('show');
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function answerTF(qi, val) {
  const q = allQ[qi];
  const btns = document.querySelectorAll(`button[data-qi="${qi}"]`);
  btns.forEach(b => b.disabled = true);
  const correct = val === q.correct;
  btns.forEach(b => {
    if (String(b.dataset.val) === String(q.correct)) b.classList.add('correct');
    if (b.dataset.val === String(val) && !correct) b.classList.add('wrong');
  });
  if (correct) score++;
  answered++;
  document.getElementById('expl_' + qi).classList.add('show');
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function revealFreeform(qi) {
  document.getElementById('expl_' + qi).classList.add('show');
  answered++;
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function nextQ() {
  idx++;
  if (idx >= allQ.length) { showResults(); return; }
  showQuestion(idx);
}

function showResults() {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const pct = answered > 0 ? Math.round(score/answered*100) : 0;
  document.getElementById('finalScore').textContent = pct + '%';
  let grade = pct >= 90 ? 'Outstanding!' : pct >= 70 ? 'Great work!' : pct >= 50 ? 'Good effort — keep studying!' : 'Review the material and try again.';
  document.getElementById('gradeText').textContent = grade + ` (${score}/${answered} correct)`;
  document.getElementById('resultsCard').style.display = 'block';
  document.getElementById('progressFill').style.width = '100%';
  // Save to localStorage for dashboard
  try {
    const sessions = JSON.parse(localStorage.getItem('sf_quiz_sessions') || '[]');
    sessions.push({ date: new Date().toISOString(), score, total: answered, pct });
    localStorage.setItem('sf_quiz_sessions', JSON.stringify(sessions));
  } catch(e) {}
}

function restart() {
  document.getElementById('resultsCard').style.display = 'none';
  init();
}

init();
</script>
